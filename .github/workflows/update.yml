name: Update Ferry Schedule

on:
  schedule:
    # Запуск каждый час с 02:00 до 19:00 UTC (это 05:00 - 22:00 по Волгограду UTC+3)
    - cron: '0 2-19 * * *'
  workflow_dispatch: # Позволяет запускать скрипт вручную кнопкой

permissions:
  contents: write

jobs:
  parse-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run parser and send notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node parser.js

      - name: Commit updated schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add schedule.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update schedule" && git push)
